[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tech-shorts"
version = "0.1.0"
description = "Automatic, rights-aware tech and gaming news Shorts"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "kokoro>=0.9",
    "soundfile>=0.12",
    "numpy>=1.26",
    "scenedetect>=0.6.4",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "feedparser>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses real models or long media work"]
addopts = "-m 'not slow'"
