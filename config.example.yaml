# Copy to config.yaml and adjust. Secrets go in .env, never here.
data_dir: ~/tech-shorts-data
music_dir: assets/music
font_file: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

llm:
  gemini_model: gemini-2.5-flash
  fallback_base_url: https://api.groq.com/openai/v1
  fallback_model: llama-3.3-70b-versatile

voice:
  kokoro_voice: af_heart
  lang_code: a
  speed: 1.0

video:
  min_narration_s: 30
  max_narration_s: 55
  min_words: 65
  max_words: 100
  max_shot_s: 4.0
  max_trailer_share: 0.49
  slot_s: 3.5
  max_output_mb: 50
  music_volume: 0.12

limits:
  max_html_bytes: 5000000
  max_trailer_bytes: 300000000
  max_image_bytes: 10000000
  max_hls_seconds: 180
  ffmpeg_timeout_s: 600
  http_timeout_s: 20
