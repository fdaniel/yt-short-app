# Copy to config.yaml and adjust. Secrets go in .env, never here.
data_dir: ~/tech-shorts-data
music_dir: assets/music
font_file: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

llm:
  gemini_model: gemini-flash-latest
  fallback_base_url: https://api.groq.com/openai/v1
  fallback_model: llama-3.3-70b-versatile

voice:
  kokoro_voice: af_heart
  lang_code: a
  speed: 1.0

video:
  min_narration_s: 30
  max_narration_s: 55
  min_words: 65
  max_words: 100
  max_shot_s: 4.0
  max_trailer_share: 0.49
  slot_s: 3.5
  max_output_mb: 50
  music_volume: 0.12

limits:
  max_html_bytes: 5000000
  max_trailer_bytes: 300000000
  max_image_bytes: 10000000
  max_hls_seconds: 180
  ffmpeg_timeout_s: 600
  http_timeout_s: 20

# Automatic mode (python -m shorts run-once). Defaults shown; uncomment to change.
# discovery:
#   max_videos_per_day: 3      # local calendar day, failed videos don't count
#   videos_per_run: 1
#   max_age_h: 48              # ignore news older than this
#   min_score: 0.55            # 0-1; below this, no video is made
#   min_free_gb: 10            # stop making videos below this much free disk space
#   history_days: 14           # don't repeat a story covered in this window
#   weights: {freshness: 0.3, interest: 0.5, footage: 0.1, coverage: 0.1}
#   feeds:                     # replaces the whole default list when set
#     - {name: NVIDIA Newsroom, url: "https://nvidianews.nvidia.com/releases.xml", topic: hardware}
#     - {name: NVIDIA Blog, url: "https://blogs.nvidia.com/feed/", topic: hardware}
#     - {name: AMD Press Releases, url: "https://ir.amd.com/news-events/press-releases/rss", topic: hardware}
#     - {name: Xbox Wire, url: "https://news.xbox.com/en-us/feed/", topic: gaming}
